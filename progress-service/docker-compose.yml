# progress-service (BC#4) infrastructure.
#
# The shared redis-blacklist is owned by identy-service in the full stack; for an isolated
# BC#4 stand this file also declares it (same name/port) so authentication works locally.
# Create the shared network once: docker network create saymo-blacklist

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - progress-postgres-data:/var/lib/postgresql/data

  redis-bc4:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-blacklist:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BLACKLIST_PASSWORD}
    ports:
      - "${REDIS_BLACKLIST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BLACKLIST_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - saymo-blacklist

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN_DOCKER:-postgres://saymo:changeme@postgres:5432/saymo_progress?sslmode=disable}
      MIGRATIONS_PATH: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env.local
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "${SERVER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-bc4:
        condition: service_healthy
      redis-blacklist:
        condition: service_healthy
    networks:
      - default
      - saymo-blacklist
    profiles: ["full"]

volumes:
  progress-postgres-data:

networks:
  default:
  saymo-blacklist:
    external: true
