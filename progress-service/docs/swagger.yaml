  github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminAnswersPage:
    properties:
      answers:
        items:
          $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminAnswerView'
