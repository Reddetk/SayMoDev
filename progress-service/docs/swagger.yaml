  github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminProgressView:
    properties:
      accessibleLessons:
        items:
          $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminAccessibleLessonView'
