info:
  contact: {}
  description: 'Progress tracking and assessment: programs, answers, completion, tariff-based
    access.'
  title: progress-service API (BC#4)
  version: "1.0"
paths:
  /admin/answers/{accountId}:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminAnswersPage'
      security:
      - BearerAuth: []
      summary: 'Admin: all answers'
      tags:
      - admin
  /admin/answers/{accountId}/{lessonId}:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminAnswerView'
            type: array
      security:
      - BearerAuth: []
      summary: 'Admin: lesson answers'
      tags:
      - admin
  /admin/progress/{accountId}:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.AdminProgressView'
      security:
      - BearerAuth: []
      summary: 'Admin: patient progress'
      tags:
      - admin
  /admin/progress/{accountId}/difficulty:
    patch:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ChangeDifficultyResult'
      security:
      - BearerAuth: []
      summary: 'Admin: change difficulty'
      tags:
      - admin
  /admin/progress/program/{programId}/version/{version}/active-patients:
    get:
      parameters:
      - description: Shared service-to-service secret
        in: header
        name: X-Service-Token
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ActivePatientsView'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'Deletion guard: active patients'
      tags:
      - admin
  /progress/difficulty:
    patch:
      parameters:
      - description: UUID v4
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ChangeDifficultyResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change difficulty
      tags:
      - progress
  /progress/lessons/{lessonId}/answers:
    post:
      parameters:
      - description: UUID v4
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.SubmitAnswerResult'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit answer
      tags:
      - answers
  /progress/lessons/{lessonId}/answers/presign:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.PresignResult'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Presign answer upload
      tags:
      - answers
  /progress/lessons/{lessonId}/complete:
    post:
      parameters:
      - description: UUID v4
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.CompleteResult'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete lesson
      tags:
      - progress
  /progress/me:
    delete:
      parameters:
      - description: delete-my-progress
        in: header
        name: X-Confirmation
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Self-delete progress
      tags:
      - progress
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ProgressView'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Patient progress
      tags:
      - progress
  /progress/me/activate:
    post:
      parameters:
      - description: UUID v4
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ActivateResult'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate program
      tags:
      - progress
  /progress/programs/{programId}/resume:
    post:
      parameters:
      - description: UUID v4
        in: header
        name: Idempotency-Key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ResumeResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resume program
      tags:
      - progress
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
