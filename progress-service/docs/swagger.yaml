    type: object
  github_com_Reddetk_SayMoDev_progress-service_internal_port_in.ActivateResult:
    properties:
      accessibleLesson:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_progress-service_internal_port_in.GrantedLessonView'
      accountId:
        type: string
      completionPercent:
        type: integer
      programId:
        type: string
      status:
