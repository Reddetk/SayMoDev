basePath: /
definitions:
  http.changePasswordReq:
    properties:
      currentPassword:
        type: string
      newPassword:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  http.classifierReqBody:
    properties:
      aphasiaType:
        type: string
      difficulty:
        description: |-
          @Description Classifier validation payload
          @Example {"difficulty":"hard","aphasiaType":"none"}
        type: string
    required:
    - aphasiaType
    - difficulty
    type: object
  http.lockAccountReq:
    properties:
      locked_until:
        description: LockedUntil is a Unix timestamp (seconds). Null means indefinite
          lock.
        type: integer
    type: object
  http.loginReq:
    properties:
      email:
        description: |-
          @Description Login payload
          @Example {"email":"user@example.com","password":"secret","fingerprint":"fp"}
        type: string
      fingerprint:
        type: string
      password:
        type: string
    required:
    - email
    - fingerprint
    - password
    type: object
  http.passwordResetReq:
    properties:
      email:
        description: |-
          @Description Email for password reset
          @Example user@example.com
        type: string
    required:
    - email
    type: object
  http.patchAccountReq:
    properties:
      personalInfo:
        type: string
      role:
        type: string
    type: object
  http.registerReq:
    properties:
      classifier:
        $ref: '#/definitions/http.classifierReqBody'
      email:
        description: |-
          @Description Registration payload
          @Example {"email":"user@example.com","verifyCode":"123456","password":"StrongPass123","role":"user","fingerprint":"fp","classifier":{"difficulty":"hard","aphasiaType":"none"}}
        type: string
      fingerprint:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        type: string
      verifyCode:
        type: string
    required:
    - classifier
    - email
    - fingerprint
    - password
    - role
    - verifyCode
    type: object
  http.registerVerifyReq:
    properties:
      email:
        description: |-
          @Description Email для отправки verify-кода
          @Example user@example.com
        type: string
    required:
    - email
    type: object
info:
  contact: {}
  description: HTTP API для управления идентификацией и доступом SayMo.
  title: SayMo Identity Service API
  version: "1.0"
paths:
  /iam/.well-known/jwks.json:
    get:
      description: Возвращает набор публичных ключей для верификации подписи JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get JWKS public key set
      tags:
      - Auth
  /iam/accounts/{accountId}:
    delete:
      description: Мягкое удаление аккаунта
      produces:
      - application/json
      responses: {}
      summary: Soft delete account
      tags:
      - Accounts
    get:
      description: Получение данных аккаунта по ID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get account by ID
      tags:
      - Accounts
    patch:
      consumes:
      - application/json
      description: Частичное обновление данных аккаунта
      parameters:
      - description: Доля.role и/или personalInfo
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.patchAccountReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Patch account by ID
      tags:
      - Accounts
  /iam/accounts/{accountId}/lock:
    post:
      consumes:
      - application/json
      description: Блокировка аккаунта администратором
      parameters:
      - description: locked_until (Unix timestamp, null for indefinite)
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.lockAccountReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Lock account
      tags:
      - Accounts
  /iam/accounts/{accountId}/password:
    post:
      consumes:
      - application/json
      description: Смена пароля для аккаунта
      parameters:
      - description: Текущий и новый пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.changePasswordReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: password policy violation
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid current password
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change password
      tags:
      - Accounts
  /iam/accounts/{accountId}/sessions:
    get:
      description: Получение списка сессий аккаунта
      produces:
      - application/json
      responses: {}
      summary: List sessions for account
      tags:
      - Accounts
  /iam/accounts/{accountId}/sessions/{sessionId}:
    delete:
      description: Завершение сессии (для админа или владельца)
      produces:
      - application/json
      responses: {}
      summary: Terminate session
      tags:
      - Accounts
  /iam/accounts/{accountId}/unlock:
    post:
      description: Разблокировка аккаунта администратором
      produces:
      - application/json
      responses: {}
      summary: Unlock account
      tags:
      - Accounts
  /iam/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Auth
  /iam/auth/logout:
    post:
      description: 'Требует Authorization: Bearer <JWT>.'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout and terminate session
      tags:
      - Auth
  /iam/auth/oauth/google:
    get:
      description: Начало процесса аутентификации через Google
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Initiate Google OAuth flow
      tags:
      - Auth
  /iam/auth/password-reset:
    post:
      consumes:
      - application/json
      description: 'Anti-enumeration: идентичный ответ независимо от существования
        email'
      parameters:
      - description: Email для отправки кода reset
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.passwordResetReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset code
      tags:
      - Auth
  /iam/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /iam/auth/register/verify:
    post:
      consumes:
      - application/json
      - application/json
      description: |-
        Anti-enumeration: всегда возвращает 200 независимо от существования email.
        Anti-enumeration: всегда возвращает 200 независимо от существования email
      parameters:
      - description: Email для отправки verify-кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerVerifyReq'
      - description: Email для отправки verify-кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerVerifyReq'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request verification code for registration
      tags:
      - Auth
      - Auth
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Формат: Bearer {token}.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
