basePath: /
definitions:
  http.classifierReqBody:
    properties:
      aphasiaType:
        type: string
      difficulty:
        type: string
    required:
    - aphasiaType
    - difficulty
    type: object
  http.loginReq:
    properties:
      email:
        type: string
      fingerprint:
        type: string
      password:
        type: string
    required:
    - email
    - fingerprint
    - password
    type: object
  http.registerReq:
    properties:
      classifier:
        $ref: '#/definitions/http.classifierReqBody'
      email:
        type: string
      fingerprint:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        type: string
      verifyCode:
        type: string
    required:
    - classifier
    - email
    - fingerprint
    - password
    - role
    - verifyCode
    type: object
  http.registerVerifyReq:
    properties:
      email:
        type: string
    required:
    - email
    type: object
info:
  contact: {}
  description: HTTP API для управления идентификацией и доступом SayMo.
  title: SayMo Identity Service API
  version: "1.0"
paths:
  /iam/.well-known/jwks.json:
    get:
      description: Возвращает набор публичных ключей для верификации подписи JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get JWKS public key set
      tags:
      - Auth
  /iam/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Auth
  /iam/auth/logout:
    post:
      description: 'Требует Authorization: Bearer <JWT>.'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout and terminate session
      tags:
      - Auth
  /iam/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /iam/auth/register/verify:
    post:
      consumes:
      - application/json
      description: 'Anti-enumeration: всегда возвращает 200 независимо от существования
        email.'
      parameters:
      - description: Email для отправки verify-кода
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.registerVerifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request email verification code for registration
      tags:
      - Auth
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Формат: Bearer {token}.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
