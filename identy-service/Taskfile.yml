# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  ENV: '{{default "local" .ENV}}'

dotenv: ['.env.{{.ENV}}']

tasks:

  # ---------------------------------------------------------------------------
  # RSA keys
  # Генерация через Go -- не требует openssl в PATH. Идемпотентно.
  # ---------------------------------------------------------------------------

  gen-rsa:
    desc: "Generate RSA-2048 key pair in testdata/keys/ (no openssl required)"
    cmds:
      - go run ./cmd/genrsa/main.go
    generates:
      - testdata/keys/private.pem
      - testdata/keys/public.pem

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  infra:up:
    desc: "Start postgres + redis (detached). Postgres healthcheck managed by docker compose."
    cmds:
      - docker compose up -d postgres redis-bc1 redis-blacklist migrate-init
      - docker compose ps

  infra:down:
    desc: "Stop infra containers (volumes preserved)"
    cmds:
      - docker compose down

  infra:destroy:
    desc: "Stop containers AND delete volumes (full reset)"
    cmds:
      - docker compose down -v

  infra:logs:
    desc: "Tail infra container logs"
    cmds:
      - docker compose logs -f postgres redis-bc1 redis-blacklist

  # ---------------------------------------------------------------------------
  # Migrations
  # ---------------------------------------------------------------------------

  migrate:up:
    desc: "Apply all pending migrations"
    cmds:
      - go run ./cmd/migrate/main.go -action up

  migrate:down:
    desc: "Roll back the last migration"
    cmds:
      - go run ./cmd/migrate/main.go -action down

  migrate:force:
    desc: "Force-set schema version. Use: task migrate:force VERSION=N"
    cmds:
      - go run ./cmd/migrate/main.go -action force -version {{.VERSION}}
    requires:
      vars: [VERSION]

  # ---------------------------------------------------------------------------
  # Postbox mock (dev-only)
  # Запускай в отдельном терминале рядом с task run.
  # Инбокс: http://localhost:9025
  # ---------------------------------------------------------------------------

  postbox:mock:
    desc: "Run local Postbox mock on :9025 (dev-only, never use in prod)"
    cmds:
      - go run ./cmd/postboxmock/main.go

  # ---------------------------------------------------------------------------
  # Server
  # ---------------------------------------------------------------------------

  run:
    desc: "Run identity-service locally"
    cmds:
      - go run ./cmd/main.go

  build:
    desc: "Build server binary -> bin/server"
    cmds:
      - go build -ldflags="-s -w" -o bin/server ./cmd/main.go

  build:migrate:
    desc: "Build migrate binary -> bin/migrate"
    cmds:
      - go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate/main.go

  # ---------------------------------------------------------------------------
  # Docker full stack
  # ---------------------------------------------------------------------------

  docker:up:
    desc: "Build and start full stack via docker compose (includes migrate-init)"
    cmds:
      - docker compose up --build -d
      - docker compose ps

  docker:down:
    desc: "Stop full stack"
    cmds:
      - docker compose down

  docker:logs:
    desc: "Tail server logs"
    cmds:
      - docker compose logs -f server

  # ---------------------------------------------------------------------------
  # Dev
  # Первый запуск: task gen-rsa && task dev
  # В отдельном терминале: task postbox:mock
  # ---------------------------------------------------------------------------

  dev:
    desc: "Start infra then run migrate + server locally"
    cmds:
      - task: infra:up
      - task: migrate:up
      - task: run

  # ---------------------------------------------------------------------------
  # Helpers
  # ---------------------------------------------------------------------------

  tidy:
    desc: "go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  test:
    desc: "Run unit tests"
    cmds:
      - go test ./... -count=1 -race

  test:cover:
    desc: "Run tests with HTML coverage report"
    cmds:
      - go test ./... -count=1 -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
