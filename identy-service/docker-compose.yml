# identity-service  полная инкапсулированная среда
#
# Переменные читаются через Taskfile dotenv: ['.env.local'].
# При запуске напрямую без Taskfile:
#   docker compose env-file .env.local up -d

services:

  # 
  # PostgreSQL
  # 
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # -
  # Redis  L2-кэш identity-service (JWKS, сессии)
  # -
  redis-bc1:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  #
  # Redis Blacklist  shared (jti blacklist + account rev)
  # Владелец: identity-service. BC#3 и BC#4  external network.
  # 
  redis-blacklist:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BLACKLIST_PASSWORD}
    ports:
      - "${REDIS_BLACKLIST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BLACKLIST_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - saymo-blacklist

  # 
  # migrate-init  применяет миграции и завершается.
  # depends_on service_healthy гарантирует что postgres готов принимать соединения.
  # 
  migrate-init:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 
  # Server  основной бинарник сервиса
  # 
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      POSTGRES_DSN:             ${POSTGRES_DSN}
      REDIS_URL:                ${REDIS_URL}
      REDIS_BLACKLIST_ADDR:     ${REDIS_BLACKLIST_ADDR}
      REDIS_BLACKLIST_PASSWORD: ${REDIS_BLACKLIST_PASSWORD}
      JWT_PRIVATE_KEY_PATH:     ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH:      ${JWT_PUBLIC_KEY_PATH}
      JWT_KID:                  ${JWT_KID}
      GOOGLE_CLIENT_ID:         ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:     ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI:      ${GOOGLE_REDIRECT_URI}
      HTTP_ADDR:                ${HTTP_ADDR}
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-bc1:
        condition: service_healthy
      redis-blacklist:
        condition: service_healthy
      migrate-init:
        condition: service_completed_successfully
    networks:
      - default
      - saymo-blacklist

  jaeger:
    image: jaegertracing/jaeger:latest
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
    depends_on:
      - postgres
      - redis-bc1
      - redis-blacklist
    networks:
      - default
      - saymo-blacklist

volumes:
  postgres-data:

networks:
  default:
  saymo-blacklist:
    driver: bridge
    # BC#3 и BC#4 подключаются с external: true в своих compose-файлах
