# identity-service -- полная инкапсулированная среда
# Запуск: ENV=local docker compose up -d
# По умолчанию ENV=local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Redis -- собственный L2-кэш identity-service (JWKS-кэш, сессии)
  # ---------------------------------------------------------------------------
  redis-bc1:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis Blacklist -- shared инстанс (jti blacklist + account rev)
  # Владелец: identity-service. BC#3 и BC#4 подключаются через external network.
  # ---------------------------------------------------------------------------
  redis-blacklist:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BLACKLIST_PASSWORD}
    ports:
      - "${REDIS_BLACKLIST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BLACKLIST_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - saymo-blacklist

  # ---------------------------------------------------------------------------
  # Migrate -- запускает миграции и завершается
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.${ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-action", "up"]

  # ---------------------------------------------------------------------------
  # Server -- основной бинарник сервиса
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env.${ENV:-local}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-bc1:
        condition: service_healthy
      redis-blacklist:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - saymo-blacklist

volumes:
  postgres-data:

networks:
  default:
  saymo-blacklist:
    driver: bridge
    # BC#3 и BC#4 подключаются с external: true в своих docker-compose.yml
