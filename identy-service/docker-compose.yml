# identity-service -- полная инкапсулированная среда
#
# docker compose сам НЕ читает dotenv -- переменные передаются через env_file.
# Каждый сервис имеет env_file: .env.local (или .env.${ENV} если ENV задан).
# Порядок приоритета внутри контейнера: env_file < environment: block.
#
# Запуск через Taskfile (рекомендовано):
#   task infra:up
#   task migrate:up
#   task run
#
# Запуск напрямую (нужен .env.local):
#   docker compose --env-file .env.local up -d

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env.${ENV:-local}
        required: false
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-saymo_identity}
      POSTGRES_USER:     ${POSTGRES_USER:-saymo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${POSTGRES_DB:-saymo_identity}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saymo} -d ${POSTGRES_DB:-saymo_identity}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Redis -- собственный L2-кэш identity-service (JWKS-кэш, сессии)
  # ---------------------------------------------------------------------------
  redis-bc1:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env.${ENV:-local}
        required: false
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis Blacklist -- shared инстанс (jti blacklist + account rev)
  # Владелец: identity-service. BC#3 и BC#4 подключаются через external network.
  # ---------------------------------------------------------------------------
  redis-blacklist:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env.${ENV:-local}
        required: false
    command: redis-server --requirepass ${REDIS_BLACKLIST_PASSWORD:-changeme}
    ports:
      - "${REDIS_BLACKLIST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BLACKLIST_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - saymo-blacklist

  # ---------------------------------------------------------------------------
  # Migrate -- запускает миграции и завершается
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
      - path: .env.${ENV:-local}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-action", "up"]

  # ---------------------------------------------------------------------------
  # Server -- основной бинарник сервиса
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - path: .env.local
        required: false
      - path: .env.${ENV:-local}
        required: false
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-bc1:
        condition: service_healthy
      redis-blacklist:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - saymo-blacklist

volumes:
  postgres-data:

networks:
  default:
  saymo-blacklist:
    driver: bridge
    # BC#3 и BC#4 подключаются с external: true в своих docker-compose.yml
