<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="07-state-machine-title 07-state-machine-desc">
  <title id="07-state-machine-title">Subscription status machine</title>
  <desc id="07-state-machine-desc">State machine of pending, active, suspended, cancelled and expired with nine legal transitions and their guards.</desc>
  <defs>
  <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/>
  </marker>
  <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#bf4520"/>
  </marker>
  <marker id="arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#2e5aa8"/>
  </marker>
  <marker id="arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#4f5d75" stroke-width="1.3"/>
  </marker>
  <marker id="open-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#2d3142" stroke-width="1.2"/>
  </marker>
  <marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
    <polygon points="0 5, 7 0, 14 5, 7 10" fill="#2d3142"/>
  </marker>
  <marker id="diamond-hollow" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
    <polygon points="0 5, 7 0, 14 5, 7 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  </marker>
  <marker id="tri-hollow" markerWidth="16" markerHeight="14" refX="1" refY="7" orient="auto">
    <polygon points="1 7, 15 1, 15 13" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  </marker>
</defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="60" y="44" fill="#5a6580" font-size="10" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.18em">BC#2 · SUBSCRIPTION STATE MACHINE</text><text x="60" y="84" fill="#2d3142" font-size="30" font-weight="400" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" text-anchor="start">Five statuses, nine legal transitions</text><text x="60" y="110" fill="#5a6580" font-size="12.5" font-weight="400" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="start">Status changes live in internal/domain/subscription.go; guards are checked before the write, never by the HTTP layer.</text><path d="M 97,440 L 160,440" fill="none" stroke="#2d3142" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 300,380 L 300,150 L 1270,150 L 1270,210" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="732.8" y="130" width="54.4" height="13" rx="6" fill="#f5f5f5"/><text x="760" y="141" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.05em">CANCEL</text><path d="M 360,380 L 360,270 L 640,270" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="413.6" y="250" width="92.8" height="13" rx="6" fill="#f5f5f5"/><text x="460" y="261" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.05em">ACCOUNT LOCK</text><path d="M 380,440 L 640,440" fill="none" stroke="#2d3142" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="476.4" y="420" width="67.2" height="13" rx="6" fill="#f5f5f5"/><text x="510" y="431" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.05em">ACTIVATE</text><path d="M 740,380 L 740,330" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="671.2" y="348" width="60.800000000000004" height="14" rx="6" fill="#f5f5f5"/><text x="724" y="358.5" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="end" letter-spacing="0.05em">SUSPEND</text><path d="M 800,330 L 800,380" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="808" y="348" width="54.4" height="14" rx="6" fill="#f5f5f5"/><text x="816" y="358.5" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.05em">RESUME</text><path d="M 880,400 L 1100,400 L 1100,290 L 1160,290" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="962.8" y="380" width="54.4" height="13" rx="6" fill="#f5f5f5"/><text x="990" y="391" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.05em">CANCEL</text><path d="M 1270,330 L 1270,550" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1278" y="433" width="54.4" height="14" rx="6" fill="#f5f5f5"/><text x="1286" y="443.5" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.05em">EXPIRE</text><path d="M 840,210 L 840,170 L 1470,170 L 1470,610 L 1380,610" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1478" y="383" width="54.4" height="14" rx="6" fill="#f5f5f5"/><text x="1486" y="393.5" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.05em">EXPIRE</text><path d="M 760,500 L 760,610 L 1160,610" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="882.8" y="590" width="54.4" height="13" rx="6" fill="#f5f5f5"/><text x="910" y="601" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.05em">EXPIRE</text><circle cx="90" cy="440" r="7" fill="#2d3142"/><rect x="160" y="380" width="220" height="120" rx="6" fill="#f5f5f5"/><rect x="160" y="380" width="220" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="270.0" y="438.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">pending</text><text x="270.0" y="458.0" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">created by subscribe</text><rect x="640" y="380" width="240" height="120" rx="6" fill="#f5f5f5"/><rect x="640" y="380" width="240" height="120" rx="8" fill="#fbeeea" stroke="#bf4520" stroke-width="1.2"/><text x="760.0" y="438.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">active</text><text x="760.0" y="458.0" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">tariff snapshot fixed</text><rect x="640" y="210" width="240" height="120" rx="6" fill="#f5f5f5"/><rect x="640" y="210" width="240" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="760.0" y="268.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">suspended</text><text x="760.0" y="288.0" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">BC#1 account lock</text><rect x="1160" y="210" width="220" height="120" rx="6" fill="#f5f5f5"/><rect x="1160" y="210" width="220" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="1270.0" y="268.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">cancelled</text><text x="1270.0" y="288.0" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">user choice</text><rect x="1160" y="550" width="220" height="120" rx="6" fill="#f5f5f5"/><rect x="1160" y="550" width="220" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/><text x="1270.0" y="608.0" fill="#2d3142" font-size="16" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">expired</text><text x="1270.0" y="628.0" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">terminal</text><line x1="60" y1="720" x2="1540" y2="720" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/><text x="60" y="746" fill="#5a6580" font-size="10" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.10em">EVENTS · activate · suspend · resume · cancel · expire</text><text x="60" y="772" fill="#2d3142" font-size="11.5" font-weight="400" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="start">GUARDS · activate requires Payment.status = success (§5) · expire requires period_end ≤ now (§7) · resume rejected once the period expired</text><text x="60" y="796" fill="#2d3142" font-size="11.5" font-weight="400" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="start">cancel keeps the tariff until period_end (§2) · expired is terminal; a new purchase starts a new subscription in pending</text><line x1="60" y1="820" x2="1540" y2="820" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="60" y="842" fill="#5a6580" font-size="9" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="160" y1="838" x2="194" y2="838" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="206" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">TRANSITION</text><line x1="322.0" y1="838" x2="356.0" y2="838" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><text x="368.0" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">GUARDED PATH</text><rect x="497.2" y="830" width="34" height="16" rx="3" fill="#fbeeea" stroke="#bf4520" stroke-width="0.9"/><text x="543.2" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">STEADY STATE</text>
</svg>
