<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="04-subscribe-sequence-title 04-subscribe-sequence-desc">
  <title id="04-subscribe-sequence-title">Subscribe and activation sequence</title>
  <desc id="04-subscribe-sequence-desc">Happy path from PWA subscription request through WebPay redirect and signed webhook to an active subscription, outbox events and polling.</desc>
  <defs>
  <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/>
  </marker>
  <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#bf4520"/>
  </marker>
  <marker id="arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#2e5aa8"/>
  </marker>
  <marker id="arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#4f5d75" stroke-width="1.3"/>
  </marker>
  <marker id="open-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#2d3142" stroke-width="1.2"/>
  </marker>
  <marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
    <polygon points="0 5, 7 0, 14 5, 7 10" fill="#2d3142"/>
  </marker>
  <marker id="diamond-hollow" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
    <polygon points="0 5, 7 0, 14 5, 7 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  </marker>
  <marker id="tri-hollow" markerWidth="16" markerHeight="14" refX="1" refY="7" orient="auto">
    <polygon points="1 7, 15 1, 15 13" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  </marker>
</defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
<text x="60" y="44" fill="#5a6580" font-size="10" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.18em">BC#2 · SUBSCRIBE AND ACTIVATION · SEQUENCE</text><text x="60" y="84" fill="#2d3142" font-size="30" font-weight="400" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif" text-anchor="start">From PWA redirect to an active subscription</text><text x="60" y="110" fill="#5a6580" font-size="12.5" font-weight="400" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="start">Two PostgreSQL transactions; the webhook is the only writer of the success state, Kafka is fed by the outbox.</text><line x1="170" y1="210" x2="170" y2="770" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/><line x1="500" y1="210" x2="500" y2="770" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/><line x1="880" y1="210" x2="880" y2="770" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/><line x1="1180" y1="210" x2="1180" y2="770" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/><line x1="1450" y1="210" x2="1450" y2="770" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/><rect x="496" y="235" width="8" height="505" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="876" y="335" width="8" height="25" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="876" y="568" width="8" height="32" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><rect x="1176" y="435" width="8" height="60" rx="0" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/><path d="M 170,250 L 500,250" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="183.0" y="230" width="304.0" height="13" rx="6" fill="#f5f5f5"/><text x="335.0" y="241" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">POST /billing/subscriptions · Idempotency-Key</text><path d="M 504,280 L 588,280 L 588,300 L 504,300" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><text x="596" y="292" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">JWT · RBAC · account · idempotency</text><path d="M 504,340 L 876,340" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="515.6" y="320" width="348.8" height="13" rx="6" fill="#f5f5f5"/><text x="690.0" y="331" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">TX1: sub(pending) + payment(pending) + idem + outbox</text><path d="M 500,390 L 170,390" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="192.6" y="370" width="284.8" height="13" rx="6" fill="#f5f5f5"/><text x="335.0" y="381" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">201 {subscriptionId, redirectUrl, pending}</text><path d="M 170,440 L 1176,440" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="964.4" y="420" width="131.2" height="13" rx="6" fill="#f5f5f5"/><text x="1030" y="431" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">redirect to WebPay</text><path d="M 1176,490 L 504,490" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="707.2" y="470" width="265.6" height="13" rx="6" fill="#f5f5f5"/><text x="840.0" y="481" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">POST /billing/webhooks/acquiring (form)</text><path d="M 496,510 L 412,510 L 412,530 L 496,530" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><text x="404" y="522" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="end" letter-spacing="0.04em">sig · ts ≤ 300 s · duplicate</text><path d="M 504,575 L 876,575" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="560.4" y="555" width="259.20000000000005" height="13" rx="6" fill="#f5f5f5"/><text x="690.0" y="566" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">TX2: payment ok · active · method bind</text><path d="M 500,625 L 1176,625" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="810.8" y="605" width="54.400000000000006" height="13" rx="6" fill="#f5f5f5"/><text x="838.0" y="616" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">200 OK</text><path d="M 504,675 L 1450,675" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="1123.2" y="655" width="124.80000000000001" height="13" rx="6" fill="#f5f5f5"/><text x="1248" y="666" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="end" letter-spacing="0.04em">OUTBOX → 3 EVENTS</text><path d="M 170,725 L 500,725" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-link)"/><rect x="199.0" y="705" width="272.0" height="13" rx="6" fill="#f5f5f5"/><text x="335.0" y="716" fill="#5a6580" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">GET /billing/subscriptions/{id} → active</text><rect x="90" y="130" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="90" y="130" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="100" y="138" width="53.2" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><text x="126.6" y="149.5" fill="#5a6580" font-size="9" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.10em">CLIENT</text><text x="170.0" y="176" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">PWA</text><text x="170.0" y="196" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">browser</text><rect x="380" y="130" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="380" y="130" width="240" height="80" rx="6" fill="#fbeeea" stroke="#bf4520" stroke-width="1"/><rect x="390" y="138" width="34.6" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><text x="407.3" y="149.5" fill="#bf4520" font-size="9" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.10em">API</text><text x="500.0" y="176" fill="#2d3142" font-size="14" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">billing-service</text><text x="500.0" y="196" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">:8002 · gin</text><rect x="770" y="130" width="220" height="80" rx="6" fill="#f5f5f5"/><rect x="770" y="130" width="220" height="80" rx="6" fill="#eaeaec" stroke="#4f5d75" stroke-width="1"/><rect x="780" y="138" width="47.0" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><text x="803.5" y="149.5" fill="#5a6580" font-size="9" font-weight="500" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.10em">STORE</text><text x="880.0" y="176" fill="#2d3142" font-size="15" font-weight="600" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">PostgreSQL</text><text x="880.0" y="196" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="middle">billing_db</text><rect x="1080" y="130" width="200" height="80" rx="6" fill="#f5f5f5"/><rect x="1080" y="130" width="200" height="80" rx="6" fill="#f1f1f2" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><rect x="1090" y="138" width="65.6" height="16" rx="2" fill="none" stroke="rgba(45