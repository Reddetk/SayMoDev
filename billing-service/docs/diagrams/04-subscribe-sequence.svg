egular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="160" y1="838" x2="194" y2="838" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="206" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">CALL</text><line x1="282.4" y1="838" x2="316.4" y2="838" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="328.4" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">RETURN</text><line x1="418.0" y1="838" x2="452.0" y2="838" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><text x="464.0" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">ASYNC / OUTBOX</text><rect x="606.4" y="830" width="34" height="16" rx="3" fill="#fbeeea" stroke="#bf4520" stroke-width="0.9"/><text x="652.4" y="842" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.04em">ATOMIC STATE CHANGE</text>
