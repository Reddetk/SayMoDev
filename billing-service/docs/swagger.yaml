  github_com_Reddetk_SayMoDev_billing-service_internal_port_in.ScheduledChangeView:
    properties:
      effectiveAt:
        type: string
      targetTariffPlanId:
        type: string
    type: object
  github_com_Reddetk_SayMoDev_billing-service_internal_port_in.SubscribeResult:
    properties:
      billingPeriod:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.PeriodView'
      payment:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.InitiatedPayment'
      status:
        type: string
      subscriptionId:
        type: string
      tariffSnapshot:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.TariffSnapshotView'
    type: object
  github_com_Reddetk_SayMoDev_billing-service_internal_port_in.SubscriptionView:
    properties:
      accountId:
        type: string
      billingPeriod:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.PeriodView'
      revoked_at:
        type: string
      scheduledChange:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.ScheduledChangeView'
      status:
        type: string
      subscriptionId:
        type: string
      tariffSnapshot:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.TariffSnapshotView'
    type: object
  github_com_Reddetk_SayMoDev_billing-service_internal_port_in.TariffSnapshotView:
    properties:
      timezone:
