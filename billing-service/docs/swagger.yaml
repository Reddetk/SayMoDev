        type: string
      targetTariffPlanId:
        type: string
    type: object
  github_com_Reddetk_SayMoDev_billing-service_internal_port_in.UpgradeResult:
    properties:
      acquiringRedirectUrl:
        type: string
      prorationCharge:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.ProrationCharge'
      status:
        type: string
      subscriptionId:
        type: string
      tariffSnapshot:
        $ref: '#/definitions/github_com_Reddetk_SayMoDev_billing-service_internal_port_in.TariffSnapshotView'
