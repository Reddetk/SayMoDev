# billing-service (BC#2) — локальный стенд со всеми зависимостями.
#
# Запуск:  docker compose --env-file .env.local up -d
# Только инфраструктура: docker compose --env-file .env.local up -d postgres redis-bc2 kafka kafka-init jaeger
#
# Redis Blacklist (shared, владелец BC#1) в этот compose не входит:
# локально поднимается identy-service, сервис подключается к localhost:6380 (шаг 4).

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-billing_db}
      POSTGRES_USER:     ${POSTGRES_USER:-saymo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saymo} -d ${POSTGRES_DB:-billing_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-bc2:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "${REDIS_PORT:-6392}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared revocation store (в prod владелец BC#1). Локальный стенд держит свою копию.
  redis-blacklist:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_BLACKLIST_PASSWORD:-changeme}
    ports:
      - "${REDIS_BLACKLIST_PORT:-6384}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_BLACKLIST_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29192
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: saymo-billing-kraft-01
    ports:
      - "${KAFKA_PORT:-29192}:29192"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_EVENTS_TOPIC:-saymo.billing.events} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_IDENTITY_TOPIC:-saymo.identity.events} --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16692:16686"
      - "4322:4317"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - server

  keygen:
    image: golang:1.25-alpine
    working_dir: /src
    command: ["go", "run", "./cmd/genrsa", "-dir", "/keys"]
    volumes:
      - .:/src
      - ./testdata/keys:/keys
    restart: "no"

  acquiringmock:
    image: golang:1.25-alpine
    working_dir: /src
    command: ["go", "run", "./cmd/acquiringmock"]
    environment:
      ACQUIRING_MOCK_ADDR: ":9031"
    volumes:
      - .:/src
    ports:
      - "9031:9031"
    restart: unless-stopped

  postboxmock:
    image: golang:1.25-alpine
    working_dir: /src
    command: ["go", "run", "./cmd/postboxmock"]
    environment:
      POSTBOX_MOCK_ADDR: ":9025"
    volumes:
      - .:/src
    restart: unless-stopped

  migrate-init:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-saymo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-billing_db}?sslmode=disable
      MIGRATIONS_PATH: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      ENV: ${ENV:-local}
      SERVER_PORT: 8002
      METRICS_PORT: 9002
      POSTGRES_DSN: postgres://${POSTGRES_USER:-saymo}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-billing_db}?sslmode=disable
      REDIS_ADDR: redis-bc2:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      REDIS_BLACKLIST_ADDR: redis-blacklist:6379
      REDIS_BLACKLIST_PASSWORD: ${REDIS_BLACKLIST_PASSWORD:-changeme}
      JWT_ISSUER: ${JWT_ISSUER:-urn:saymo:identity-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api.saymo}
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      ACQUIRING_API_URL: http://acquiringmock:9031/pay
      ACQUIRING_STORE_ID: ${ACQUIRING_STORE_ID:-test-store}
      ACQUIRING_SECRET_KEY: ${ACQUIRING_SECRET_KEY:-local-secret}
      ACQUIRING_RETURN_URL: ${ACQUIRING_RETURN_URL:-http://localhost:3000/billing/return}
      ACQUIRING_NOTIFY_URL: ${ACQUIRING_NOTIFY_URL:-http://localhost:8002/billing/webhooks/acquiring}
      POSTBOX_ENDPOINT: http://postboxmock:9025/v2/email/outbound-emails
      POSTBOX_IAM_TOKEN: ${POSTBOX_IAM_TOKEN:-fake-iam-token-for-local}
      POSTBOX_FROM_ADDRESS: ${POSTBOX_FROM_ADDRESS:-noreply@saymo.ru}
      POSTBOX_DEFAULT_RECIPIENT: ${POSTBOX_DEFAULT_RECIPIENT:-patient@example.com}
      KAFKA_BROKERS: kafka:9092
      LIFECYCLE_INTERVAL: ${LIFECYCLE_INTERVAL:-15m}
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    volumes:
      - ./testdata/keys:/keys:ro
    ports:
      - "${SERVER_PORT:-8002}:8002"
      - "${METRICS_PORT:-9002}:9002"
    depends_on:
      postgres:
        condition: service_healthy
      redis-bc2:
        condition: service_healthy
      redis-blacklist:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate-init:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
      acquiringmock:
        condition: service_started
      postboxmock:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
