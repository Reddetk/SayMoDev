# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  ENV: '{{default "local" .ENV}}'

dotenv: ['.env.{{.ENV}}']

tasks:

  gen-rsa:
    desc: "Generate RSA-2048 JWT keys in testdata/keys (local/test only)"
    cmds:
      - go run ./cmd/genrsa

  token:
    desc: "Issue a dev JWT (SUB=..., ROLE=patient)"
    cmds:
      - go run ./cmd/devtoken -sub {{default "00000000-0000-0000-0000-000000000001" .SUB}} -role {{default "patient" .ROLE}}

  infra:up:
    desc: "Start postgres, redis-bc2, kafka (+topics) and jaeger"
    cmds:
      - docker compose --env-file .env.{{.ENV}} up -d postgres redis-bc2 redis-blacklist kafka kafka-init jaeger
      - docker compose --env-file .env.{{.ENV}} ps

  infra:down:
    desc: "Stop infra containers (volumes preserved)"
    cmds:
      - docker compose --env-file .env.{{.ENV}} down

  infra:destroy:
    desc: "Stop containers and delete volumes"
    cmds:
      - docker compose --env-file .env.{{.ENV}} down -v

  infra:logs:
    desc: "Tail infra logs"
    cmds:
      - docker compose --env-file .env.{{.ENV}} logs -f postgres redis-bc2 kafka

  compose:up:
    desc: "Build and start the whole stand including the server"
    cmds:
      - docker compose --env-file .env.{{.ENV}} up --build -d

  migrate:up:
    desc: "Apply all pending migrations"
    cmds:
      - go run ./cmd/migrate -action up

  migrate:down:
    desc: "Roll back the last migration"
    cmds:
      - go run ./cmd/migrate -action down

  migrate:force:
    desc: "Force schema version (VERSION=N)"
    requires:
      vars: [VERSION]
    cmds:
      - go run ./cmd/migrate -action force -version {{.VERSION}}

  run:
    desc: "Run the API server with the current ENV"
    cmds:
      - go run ./cmd/server

  health:
    desc: "Probe the local health endpoints"
    cmds:
      - curl -fsS http://localhost:8002/health
      - curl -fsS http://localhost:8002/health/ready
      - curl -fsS http://localhost:9002/metrics

  test:unit:
    desc: "Unit tests (no external dependencies)"
    cmds:
      - go test ./... -count=1 -race

  test:integration:
    desc: "Integration tests against the local stand"
    cmds:
      - go test -tags=integration ./... -count=1 -race

  build:
    desc: "Build server and migrate binaries"
    cmds:
      - go build -o bin/server ./cmd/server
      - go build -o bin/migrate ./cmd/migrate

  vet:
    desc: "go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "golangci-lint"
    cmds:
      - golangci-lint run ./...
