basePath: /
host: localhost:8003
info:
  contact: {}
  description: 'BC#3 Rehabilitation Content Management (SayMo). S1: health/readiness.'
  title: SayMo Rehabilitation Content Service API
  version: 0.1.0
paths:
  /admin/content/programs/{programId}/migrate-patients:
    post:
      consumes:
      - application/json
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Request batch migration of patients to a program version
      tags:
      - content
  /content/programs:
    get:
      description: 'Public catalog: latest version of each program. Filters are optional.'
      parameters:
      - description: easy|medium|hard
        in: query
        name: difficulty
        type: string
      - description: aphasia type, up to 50 chars
        in: query
        name: aphasia_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: List rehabilitation programs
      tags:
      - content
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: JSON {title, classifier}
        in: formData
        name: program
        required: true
        type: string
      - description: JSON array [{title, description}]
        in: formData
        name: lessons
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create program with lessons
      tags:
      - content
  /content/programs/{programId}:
    delete:
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete program
      tags:
      - content
    get:
      description: Public program card. version defaults to the latest; lessons belong
        to that version.
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      - description: program version
        in: query
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get program by id and version
      tags:
      - content
    patch:
      consumes:
      - application/json
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update program metadata
      tags:
      - content
  /content/programs/{programId}/lessons:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add or insert lesson
      tags:
      - content
  /content/programs/{programId}/lessons/{lessonId}:
    delete:
      responses: {}
      security:
      - BearerAuth: []
      summary: Delete lesson
      tags:
      - content
    get:
      description: Requires a valid patient/administrator JWT. contentUrl is a presigned
        GET URL (TTL 1h).
      parameters:
      - description: program UUID
        in: path
        name: programId
        required: true
        type: string
      - description: lesson UUID
        in: path
        name: lessonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get lesson with presigned PDF URL
      tags:
      - content
    patch:
      consumes:
      - multipart/form-data
      responses: {}
      security:
      - BearerAuth: []
      summary: Update lesson metadata or PDF
      tags:
      - content
  /health:
    get:
      description: Returns 200 while the process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: Returns 200 only when postgres, redis, kafka and s3 are reachable;
        otherwise 503.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
